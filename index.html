<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teensy Counter Reader</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --good: #3ddc84;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
  .panel {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.disconnect { background: var(--bad); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.connected { background: var(--good); }
  .latest {
    font-size: 3rem;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 20px;
    font-variant-numeric: tabular-nums;
  }
  .log {
    height: 260px;
    overflow-y: auto;
    background: #0b0d12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .log div:last-child { color: var(--text); }
  .error { color: var(--bad); font-size: 0.85rem; margin-top: 10px; }
  .unsupported {
    max-width: 640px;
    background: #3a1f1f;
    border: 1px solid var(--bad);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<h1>Teensy Counter Reader</h1>
<p class="sub">Reads the incrementing number sent by teensy_counter_test.ino over USB serial.</p>

<div id="unsupported" class="unsupported" style="display:none;">
  This browser doesn't support the Web Serial API. Use a Chromium-based browser
  (Chrome, Edge, Opera) over HTTPS or localhost, not Safari or Firefox.
</div>

<div class="panel" id="panel">
  <div class="controls">
    <button id="connectBtn">Connect to Teensy</button>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Disconnected</span></div>
  </div>
  <div class="latest" id="latest">—</div>
  <div class="log" id="log"></div>
  <div class="error" id="error"></div>
</div>

<script>
const connectBtn = document.getElementById('connectBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const latestEl = document.getElementById('latest');
const logEl = document.getElementById('log');
const errorEl = document.getElementById('error');
const unsupportedEl = document.getElementById('unsupported');
const panelEl = document.getElementById('panel');

let port = null;
let reader = null;
let keepReading = false;
let lineBuffer = '';

if (!('serial' in navigator)) {
  unsupportedEl.style.display = 'block';
  panelEl.style.display = 'none';
}

function setConnectedUI(connected) {
  statusDot.classList.toggle('connected', connected);
  statusText.textContent = connected ? 'Connected' : 'Disconnected';
  connectBtn.textContent = connected ? 'Disconnect' : 'Connect to Teensy';
  connectBtn.classList.toggle('disconnect', connected);
}

function logLine(text) {
  const line = document.createElement('div');
  line.textContent = text;
  logEl.appendChild(line);
  // keep the log from growing forever
  while (logEl.childNodes.length > 200) {
    logEl.removeChild(logEl.firstChild);
  }
  logEl.scrollTop = logEl.scrollHeight;
}

async function connect() {
  errorEl.textContent = '';
  try {
    // Shows the browser's native "select a serial port" picker.
    // If the Teensy doesn't appear here, it's not enumerating as a
    // serial device -- check Arduino IDE: Tools > USB Type > "Serial".
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });

    setConnectedUI(true);
    keepReading = true;
    readLoop();
  } catch (err) {
    errorEl.textContent = 'Connection failed: ' + err.message;
    setConnectedUI(false);
  }
}

async function readLoop() {
  const textDecoder = new TextDecoderStream();
  const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
  reader = textDecoder.readable.getReader();

  try {
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) {
        lineBuffer += value;
        let newlineIndex;
        while ((newlineIndex = lineBuffer.indexOf('\n')) >= 0) {
          const line = lineBuffer.slice(0, newlineIndex).trim();
          lineBuffer = lineBuffer.slice(newlineIndex + 1);
          if (line.length > 0) {
            latestEl.textContent = line;
            logLine(line);
          }
        }
      }
    }
  } catch (err) {
    errorEl.textContent = 'Read error: ' + err.message;
  } finally {
    reader.releaseLock();
    await readableStreamClosed.catch(() => {});
  }
}

async function disconnect() {
  keepReading = false;
  try {
    if (reader) {
      await reader.cancel();
    }
    if (port) {
      await port.close();
    }
  } catch (err) {
    // ignore errors on teardown
  } finally {
    port = null;
    reader = null;
    setConnectedUI(false);
  }
}

connectBtn.addEventListener('click', () => {
  if (statusText.textContent === 'Connected') {
    disconnect();
  } else {
    connect();
  }
});
</script>

</body>
</html>
