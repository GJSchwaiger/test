<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESP32 Serial Monitor</title>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161b;
    --line: #232a31;
    --amber: #ffb000;
    --amber-dim: #7a5600;
    --text: #d8dee4;
    --text-dim: #6b7580;
    --red: #ff4d4d;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }
  .frame {
    width: 100%;
    max-width: 720px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  h1 span { color: var(--amber); }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber-dim);
    box-shadow: none;
    transition: all 0.15s ease;
  }
  .led.live {
    background: var(--amber);
    box-shadow: 0 0 6px 1px var(--amber);
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  button {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    padding: 10px 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button:hover:not(:disabled) {
    border-color: var(--amber-dim);
    color: var(--amber);
  }
  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  button.stop { color: var(--red); }
  button.stop:hover:not(:disabled) { border-color: var(--red); }

  .readout {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 24px;
    margin-bottom: 20px;
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }
  .metric .label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .metric .value {
    font-size: 32px;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .metric .value small {
    font-size: 14px;
    color: var(--text-dim);
    margin-left: 4px;
  }

  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .log-header button {
    padding: 4px 10px;
    font-size: 10px;
  }
  .log {
    background: var(--panel);
    border: 1px solid var(--line);
    height: 260px;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-dim);
  }
  .log div:last-child { color: var(--amber); }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: var(--line); }

  .hint {
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .hint code {
    color: var(--amber);
    background: none;
  }
  .unsupported {
    border: 1px solid var(--red);
    color: var(--red);
    padding: 16px;
    font-size: 12px;
    margin-bottom: 20px;
    display: none;
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>USB<span>·</span>SERIAL MONITOR</h1>
    <div class="status">
      <div class="led" id="led"></div>
      <span id="statusText">DISCONNECTED</span>
    </div>
  </header>

  <div class="unsupported" id="unsupported">
    This browser doesn't support the Web Serial API. Use Chrome or Edge on desktop.
  </div>

  <div class="controls">
    <button id="connectBtn">Connect device</button>
    <button id="disconnectBtn" class="stop" disabled>Disconnect</button>
  </div>

  <div class="readout">
    <div class="metric">
      <div class="label">Value</div>
      <div class="value" id="rawVal">—</div>
    </div>
    <div class="metric">
      <div class="label">Uptime</div>
      <div class="value" id="timeVal">— <small>ms</small></div>
    </div>
  </div>

  <div class="log-header">
    <span>Raw stream</span>
    <button id="clearBtn">Clear</button>
  </div>
  <div class="log" id="log"></div>

  <div class="hint">
    Expects CSV lines from the ESP32: <code>millis, val</code> at 115200 baud.
    Flash the test sketch first, then click Connect and pick the ESP32's port.
  </div>
</div>

<script>
  const connectBtn = document.getElementById('connectBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');
  const clearBtn = document.getElementById('clearBtn');
  const led = document.getElementById('led');
  const statusText = document.getElementById('statusText');
  const logEl = document.getElementById('log');
  const rawVal = document.getElementById('rawVal');
  const timeVal = document.getElementById('timeVal');
  const unsupported = document.getElementById('unsupported');

  let port, reader, keepReading = false;

  if (!('serial' in navigator)) {
    unsupported.style.display = 'block';
    connectBtn.disabled = true;
  }

  function setConnected(isConnected) {
    connectBtn.disabled = isConnected;
    disconnectBtn.disabled = !isConnected;
    led.classList.toggle('live', isConnected);
    statusText.textContent = isConnected ? 'CONNECTED' : 'DISCONNECTED';
  }

  function logLine(text) {
    const div = document.createElement('div');
    div.textContent = text;
    logEl.appendChild(div);
    while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function handleLine(line) {
    line = line.trim();
    if (!line) return;
    logLine(line);
    const parts = line.split(',').map(p => p.trim());
    if (parts.length === 2) {
      const [ms, val] = parts;
      if (!isNaN(val)) rawVal.textContent = val;
      if (!isNaN(ms)) timeVal.innerHTML = `${ms} <small>ms</small>`;
    }
  }

  async function connect() {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      setConnected(true);
      keepReading = true;

      const textDecoder = new TextDecoderStream();
      const readableClosed = port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      let buffer = '';
      while (keepReading) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let idx;
        while ((idx = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 1);
          handleLine(line);
        }
      }
      reader.releaseLock();
      await readableClosed.catch(() => {});
    } catch (err) {
      logLine(`ERROR: ${err.message}`);
      setConnected(false);
    }
  }

  async function disconnect() {
    keepReading = false;
    if (reader) {
      try { await reader.cancel(); } catch (e) {}
    }
    if (port) {
      try { await port.close(); } catch (e) {}
    }
    setConnected(false);
  }

  connectBtn.addEventListener('click', connect);
  disconnectBtn.addEventListener('click', disconnect);
  clearBtn.addEventListener('click', () => { logEl.innerHTML = ''; });
</script>
</body>
</html>
